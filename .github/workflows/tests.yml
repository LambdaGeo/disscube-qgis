name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The core (meshes, TOML, checks, recipes) without QGIS, against the DisSCube the plugin is pinned to.
    # ubuntu-22.04: the newer runners have no Python 3.9, which some QGIS builds still ship.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: core alone (standard library only)
        run: |
          pip install pytest
          pytest -q tests --ignore=tests/qgis
      - name: against DisSCube 0.6.0
        if: matrix.python == '3.12'
        run: |
          pip install disscube==0.6.0 pyproj pyshp
          python scripts/build_catalog.py --check
          pytest -q tests --ignore=tests/qgis

  qgis:
    # The plugin inside QGIS 3.34 LTR (Qt 5) and the latest QGIS (Qt 6), without a display.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["qgis/qgis:release-3_34", "qgis/qgis:latest"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: tests in QGIS
        env:
          QT_QPA_PLATFORM: offscreen
          # the newer images put the bindings in /usr/share/qgis/python instead of dist-packages
          PYTHONPATH: /usr/share/qgis/python:/usr/share/qgis/python/plugins
        run: |
          python3 -m pip install --break-system-packages pytest mock || python3 -m pip install pytest mock
          # fail loudly if the QGIS bindings cannot be imported, instead of skipping every test
          python3 -c "import sys; print(sys.version); import qgis.core; print('QGIS', qgis.core.Qgis.version())"
          python3 -m pytest -q -p no:cacheprovider tests/qgis
